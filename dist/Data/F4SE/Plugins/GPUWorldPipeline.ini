; GPU World Pipeline - Fallout 4 F4SE plugin
; Moves world-space draw submission from the CPU to GPU-driven batches.
; Delete this file to use the built-in defaults shown below.

[General]
; 0 = plugin does nothing
bEnabled=1
; 0 = Observe: hooks only measure and log, rendering is untouched
; 1 = Batch: eligible static world geometry is drawn through GPU batches
iMode=1
; Virtual-key code that toggles batching in game for A/B comparisons (0x79 = F10, 0 = off)
iToggleKey=121
; Seconds between statistics lines in Documents\My Games\Fallout4\F4SE\GPUWorldPipeline.log (0 = off)
iStatsIntervalSeconds=10
bVerboseLogging=0

[Batching]
; Smallest number of objects worth merging into one batch
iMinMembers=2
iMaxMembersPerBucket=512
iMaxVerticesPerBucket=262144
; Batches never span more than one grid cell (game units; 4096 = one exterior cell)
fGridSize=4096.0
; Frames a group must stop growing before it is merged
iSettleFrames=30
; Frames an object must stay still before it can join a batch
iStableFrames=60
; Vertices merged on the GPU per frame (spreads the cost of loading a cell)
iIngestVertexBudget=400000
; Objects held in reserve (with a reference) while waiting for their group to settle
iMaxPendingReferences=8192
; Batch the main camera's passes (G-buffer and depth pre-pass)
bBatchMainView=1
; Batch shadow-map and mask passes
bBatchShadows=1
; Use the engine's own BSShaderProperty::CanMerge test (the precombine test) when grouping
bUseCanMerge=1
; Rotate the bitangent stored in the .w components of position/normal/tangent
bRotateBitangentW=1

[Culling]
; Hierarchical-Z occlusion culling of batch members against the previous frame's depth
bOcclusionCulling=1
fOcclusionDepthBias=0.0005
; Camera jumps longer than this (game units) skip occlusion culling for a frame
fCameraCutDistance=512.0
; 0 = Auto (NVAPI multi-draw on NVIDIA, otherwise index compaction)
; 1 = Index compaction (works on every GPU)
; 2 = NVAPI MultiDrawIndexedInstancedIndirect
; 3 = One indirect draw per object (debugging)
iIndirectMode=0

[Memory]
; GPU memory budgets in MB
iArenaVertexMB=512
iArenaIndexMB=192
iRingIndexMB=64
iStagingMB=32

[Calibration]
; Batching only starts after the renderer's behaviour has been verified with this much data
iMinSamples=512
iMinFrames=120

[Debug]
; Load .hlsl files from this folder instead of the precompiled shaders (relative to the game folder).
; They are compiled at start-up with d3dcompiler_47.dll; under Proton install it with
; "protontricks 377160 d3dcompiler_47".
sShaderDirectory=
; Compare every replaced draw with the anchor's captured draw
bValidateDraws=1
